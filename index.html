
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILVA | Comunidade</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #08080c;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.container {
  padding: 30px;
  width: 90%;
  max-width: 500px;
}

h1 {
  color: #a855f7;
  font-size: 65px;
  letter-spacing: 10px;
  text-shadow: 0 0 25px #9333ea;
  margin-bottom: 15px;
}

p {
  color: #aaa;
  margin-bottom: 35px;
}

a {
  display: block;
  padding: 18px;
  margin: 20px 0;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  font-weight: bold;
  transition: .3s;
}

.discord {
  background: #5865F2;
}

.youtube {
  background: #d71920;
}

a:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #9333ea;
}

footer {
  margin-top: 45px;
  color: #666;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="container">
  <h1>SILVA</h1>
  <p>Bem-vindo à minha comunidade!</p>

  <a class="discord"
     href="https://discord.gg/5z5YbJAKM"
     target="_blank">
     ENTRAR NO DISCORD
  </a>

  <a class="youtube"
     href="https://youtube.com/@silva_ss2?si=Pf3l4I-P4wpBFHQ_"
     target="_blank">
     MEU CANAL NO YOUTUBE
  </a>

  <footer>© 2026 SILVA</footer>
</div>
</body>
</html>
